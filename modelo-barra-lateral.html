<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Course Sidebar Component</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Lucide Icons for the menu -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style data-purpose="typography">
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <style data-purpose="custom-colors">
        /* Custom brand colors matching the provided image */
        :root {
            --brand-gold: #fcc419;
            --bg-sidebar: #111111;
            --text-gray: #71717a;
        }

        .text-brand-gold {
            color: var(--brand-gold);
        }

        .bg-brand-gold {
            background-color: var(--brand-gold);
        }

        .border-brand-gold {
            border-color: var(--brand-gold);
        }
    </style>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center p-4">
    <!-- BEGIN: SidebarCard -->
    <aside
        class="w-[300px] h-[514px] bg-[#111111] rounded-[24px] shadow-2xl flex flex-col items-center py-8 px-6 text-white overflow-hidden"
        data-purpose="user-navigation-card" id="sidebar-card">
        <!-- BEGIN: ProfileHeader -->
        <header class="flex flex-col items-center mb-6" data-purpose="profile-section">
            <!-- Profile Avatar with Gold Border -->
            <div class="w-24 h-24 rounded-full border-2 border-brand-gold flex items-center justify-center mb-3">
                <span class="text-3xl font-bold text-brand-gold tracking-wider">SR</span>
            </div>
            <!-- Username -->
            <h2 class="text-[#71717a] text-base font-medium">Giovani</h2>
        </header>
        <!-- END: ProfileHeader -->
        <!-- BEGIN: ProgressSection -->
        <section class="w-full mb-10 px-4" data-purpose="progress-tracker">
            <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-white">Seu Progresso</span>
                <span class="text-sm font-bold text-white">7%</span>
            </div>
            <!-- Progress Bar Container -->
            <div class="w-full h-1.5 bg-[#2a2a2a] rounded-full overflow-hidden">
                <!-- Progress Bar Indicator (7%) -->
                <div class="h-full bg-brand-gold rounded-full flex items-center justify-end" style="width: 7%;">
                    <!-- Small dot at the end of progress -->
                    <div class="w-1.5 h-1.5 bg-brand-gold rounded-full border border-[#111]"></div>
                </div>
            </div>
        </section>
        <!-- END: ProgressSection -->
        <!-- BEGIN: NavigationMenu -->
        <nav class="w-full" data-purpose="sidebar-navigation">
            <ul class="space-y-4">
                <!-- Inicio -->
                <li>
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="home"></i>
                        <span class="text-base font-bold text-white">Inicio</span>
                    </a>
                </li>
                <!-- Minha conta -->
                <li>
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="user"></i>
                        <span class="text-base font-bold text-white">Minha conta</span>
                    </a>
                </li>
                <!-- Meus cursos -->
                <li>
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="folder"></i>
                        <span class="text-base font-bold text-white">Meus cursos</span>
                    </a>
                </li>
                <!-- Todos os cursos -->
                <li>
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="folder-open"></i>
                        <span class="text-base font-bold text-white">Todos os cursos</span>
                    </a>
                </li>
                <!-- Meus certificados -->
                <li>
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="award"></i>
                        <span class="text-base font-bold text-white">Meus certificados</span>
                    </a>
                </li>
                <!-- Admin (spaced further down) -->
                <li class="pt-4">
                    <a class="group flex items-center gap-4 transition-colors hover:opacity-80" href="#">
                        <i class="w-5 h-5 text-brand-gold" data-lucide="wrench"></i>
                        <span class="text-base font-bold text-white">Admin</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END: NavigationMenu -->
    </aside>
    <!-- END: SidebarCard -->
    <script data-purpose="icon-initialization">
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
